<!doctype html><meta charset="utf-8"><body style="margin:0;background:#fff">
<div id="w"></div>
<script>
const p = new URLSearchParams(location.search);
fetch(p.get('f')).then(r=>r.text()).then(t=>{document.getElementById('w').innerHTML=t;const s=document.querySelector('svg');s.pauseAnimations();s.setCurrentTime(Number(p.get('t')));});
</script>
