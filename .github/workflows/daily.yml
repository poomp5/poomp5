# Redraws header, status (level/xp) and the skate log every day and publishes
# them to the `output` branch, which the README links to.
name: daily cards

on:
  schedule:
    - cron: '5 17 * * *' # 00:05 Bangkok
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/daily.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build.mjs daily --out dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
          commit_message: 'chore: redraw daily cards'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
